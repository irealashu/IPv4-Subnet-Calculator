<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPv4 Subnet Calculator</title>
    <meta property="og:title" content="IPv4 Subnet Calculator" />
    <meta
      name="description"
      content="Professional SaaS-grade IPv4 network engineering suite featuring advanced CIDR subnetting, VLSM allocation, route summarization, overlap detection, device config generation, and CIDR reference matrix."
    />
    <meta
      property="og:description"
      content="Professional SaaS-grade IPv4 network engineering suite featuring advanced CIDR subnetting, VLSM allocation, route summarization, overlap detection, device config generation, and CIDR reference matrix."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme_dark');
          var isDark = saved !== null ? saved === 'true' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
