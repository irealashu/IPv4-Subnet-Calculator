<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPv4 Subnet Calculator</title>

<style>
:root{
    --bg:#f3f6fb;
    --card:#ffffff;
    --text:#222;
    --primary:#2563eb;
    --secondary:#64748b;
    --border:#dcdcdc;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI, Arial, sans-serif;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:var(--card);
    padding:25px;
    border-radius:16px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:var(--primary);
}

.controls{
    display:grid;
    grid-template-columns:2fr 1fr auto auto;
    gap:10px;
}

input{
    padding:12px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:15px;
}

button{
    border:none;
    border-radius:10px;
    padding:12px 16px;
    cursor:pointer;
    font-size:15px;
}

.primary{
    background:var(--primary);
    color:white;
}

.secondary{
    background:var(--secondary);
    color:white;
}

.primary:hover,
.secondary:hover{
    opacity:0.9;
}

#error{
    margin-top:12px;
    color:#dc2626;
    font-weight:600;
}

#results{
    margin-top:20px;
}

.result-row{
    display:grid;
    grid-template-columns:220px 1fr auto;
    gap:10px;
    align-items:center;
    padding:12px;
    border-bottom:1px solid var(--border);
}

.result-label{
    font-weight:600;
}

.result-value{
    word-break:break-all;
}

.copy-btn{
    background:var(--primary);
    color:white;
    padding:8px 12px;
    border-radius:8px;
}

#toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#111;
    color:white;
    padding:12px 18px;
    border-radius:8px;
    opacity:0;
    transition:opacity .3s;
    z-index:999;
}

.footer{
    margin-top:15px;
    color:#666;
    font-size:13px;
    text-align:center;
}

@media (max-width:768px){

    .controls{
        grid-template-columns:1fr;
    }

    .result-row{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="card">

        <h1>🌐 IPv4 Subnet Calculator</h1>

        <div class="controls">

            <input
                id="ip"
                type="text"
                placeholder="Enter IPv4 Address (e.g. 192.168.1.10)"
            >

            <input
                id="cidr"
                type="number"
                min="0"
                max="32"
                value="24"
                placeholder="CIDR"
            >

            <button id="calcBtn" class="primary">
                Calculate
            </button>

            <button id="copyAllBtn" class="secondary">
                Copy All
            </button>

        </div>

        <div id="error"></div>

        <div id="results"></div>

        <div class="footer">
            Supports CIDR /0 to /32
        </div>

    </div>

</div>

<div id="toast"></div>

<script>

const ipInput = document.getElementById("ip");
const cidrInput = document.getElementById("cidr");
const resultDiv = document.getElementById("results");
const errorDiv = document.getElementById("error");

document.getElementById("calcBtn")
.addEventListener("click", calculate);

ipInput.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        calculate();
    }
});

document.getElementById("copyAllBtn")
.addEventListener("click", function(){

    const rows = document.querySelectorAll(".result-row");

    if(rows.length === 0){
        toast("No results to copy");
        return;
    }

    let text = "";

    rows.forEach(row => {

        text +=
        row.dataset.label +
        ": " +
        row.dataset.value +
        "\n";

    });

    navigator.clipboard.writeText(text);

    toast("All results copied");
});

function toast(message){

    const t = document.getElementById("toast");

    t.textContent = message;
    t.style.opacity = "1";

    setTimeout(() => {
        t.style.opacity = "0";
    }, 2000);
}

function addResult(label, value){

    const row = document.createElement("div");

    row.className = "result-row";
    row.dataset.label = label;
    row.dataset.value = value;

    const l = document.createElement("div");
    l.className = "result-label";
    l.textContent = label;

    const v = document.createElement("div");
    v.className = "result-value";
    v.textContent = value;

    const btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.textContent = "Copy";

    btn.addEventListener("click", function(){

        navigator.clipboard.writeText(value);

        toast(label + " copied");
    });

    row.appendChild(l);
    row.appendChild(v);
    row.appendChild(btn);

    resultDiv.appendChild(row);
}

function validIPv4(ip){

    const parts = ip.split(".");

    if(parts.length !== 4){
        return false;
    }

    return parts.every(part => {

        if(part === ""){
            return false;
        }

        const num = Number(part);

        return Number.isInteger(num)
        && num >= 0
        && num <= 255;
    });
}

function ipToInt(ip){

    return ip
    .split(".")
    .reduce((acc, octet) => {

        return ((acc << 8) >>> 0)
        + parseInt(octet, 10);

    }, 0) >>> 0;
}

function intToIp(num){

    return [
        (num >>> 24) & 255,
        (num >>> 16) & 255,
        (num >>> 8) & 255,
        num & 255
    ].join(".");
}

function ipToBinary(ip){

    return ip
    .split(".")
    .map(part =>
        Number(part)
        .toString(2)
        .padStart(8,"0")
    )
    .join(".");
}

function ipClass(ip){

    const first = Number(
        ip.split(".")[0]
    );

    if(first >= 1 && first <= 126){
        return "Class A";
    }

    if(first >= 128 && first <= 191){
        return "Class B";
    }

    if(first >= 192 && first <= 223){
        return "Class C";
    }

    if(first >= 224 && first <= 239){
        return "Class D (Multicast)";
    }

    return "Class E";
}

function addressType(ip){

    const p = ip
    .split(".")
    .map(Number);

    if(p[0] === 10){
        return "Private";
    }

    if(
        p[0] === 172 &&
        p[1] >= 16 &&
        p[1] <= 31
    ){
        return "Private";
    }

    if(
        p[0] === 192 &&
        p[1] === 168
    ){
        return "Private";
    }

    if(p[0] === 127){
        return "Loopback";
    }

    if(
        p[0] === 169 &&
        p[1] === 254
    ){
        return "Link-Local";
    }

    if(
        p[0] >= 224 &&
        p[0] <= 239
    ){
        return "Multicast";
    }

    return "Public";
}

function calculate(){

    resultDiv.innerHTML = "";
    errorDiv.textContent = "";

    const ip = ipInput.value.trim();

    const cidr = parseInt(
        cidrInput.value,
        10
    );

    if(
        !validIPv4(ip) ||
        isNaN(cidr) ||
        cidr < 0 ||
        cidr > 32
    ){
        errorDiv.textContent =
        "Please enter a valid IPv4 address and CIDR (0-32).";

        return;
    }

    localStorage.setItem("lastIP", ip);
    localStorage.setItem("lastCIDR", cidr);

    const ipInt = ipToInt(ip);

    const mask =
        cidr === 0
        ? 0
        : (0xFFFFFFFF << (32 - cidr)) >>> 0;

    const network =
        ipInt & mask;

    const broadcast =
        network | (~mask >>> 0);

    const subnetMask =
        intToIp(mask);

    const wildcardMask =
        intToIp((~mask) >>> 0);

    let firstHost = "N/A";
    let lastHost = "N/A";
    let usableHosts = 0;

    const totalAddresses =
        Math.pow(2, 32 - cidr);

    if(cidr < 31){

        firstHost =
            intToIp(network + 1);

        lastHost =
            intToIp(broadcast - 1);

        usableHosts =
            totalAddresses - 2;

    }else if(cidr === 31){

        firstHost =
            intToIp(network);

        lastHost =
            intToIp(broadcast);

        usableHosts = 2;

    }else{

        usableHosts = 1;
    }

    addResult("IP Address", ip);
    addResult("CIDR", "/" + cidr);
    addResult("IP Class", ipClass(ip));
    addResult("Address Type", addressType(ip));
    addResult("Subnet Mask", subnetMask);
    addResult("Wildcard Mask", wildcardMask);
    addResult("Network Address", intToIp(network));
    addResult("Broadcast Address", intToIp(broadcast));
    addResult("First Host", firstHost);
    addResult("Last Host", lastHost);
    addResult("Total Addresses", totalAddresses.toLocaleString());
    addResult("Usable Hosts", usableHosts.toLocaleString());
    addResult("Binary Representation", ipToBinary(ip));
}

ipInput.value =
localStorage.getItem("lastIP") || "";

cidrInput.value =
localStorage.getItem("lastCIDR") || "24";

</script>

</body>
</html>
